services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
    shm_size: 1g
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      API_TOKEN: ${API_TOKEN:-recruitment-test-token}
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
      PORT: 8080
      PG_POOL_MAX: 20
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s

volumes:
  pgdata:
